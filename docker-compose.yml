---
# The top-level "version" key is obsolete and ignored by Compose v2.
services:
  mongo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "27017"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - mongo-data:/data/db
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mongo-data:
