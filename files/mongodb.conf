---
# The storage block was previously declared twice; YAML keeps only the last
# occurrence of a key, so the dbPath in the first block was silently discarded
# and mongod fell back to its compiled-in default. Both blocks are merged here.
storage:
  dbPath: /data/db
  engine: wiredTiger
# No systemLog destination, so mongod logs to stdout where the container
# runtime can collect it, and the image needs no writable log directory.
systemLog:
  verbosity: 0
processManagement:
  fork: false
net:
  port: 27017
replication:
  replSetName: docker
security:
  authorization: enabled
  clusterAuthMode: keyFile
  keyFile: /run/mongod-secrets/mongodb.keyfile
  transitionToAuth: true
